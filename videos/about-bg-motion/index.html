<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>About Background Network</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050d1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050d1a;
      }
      #scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* soft drifting gradient orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      #orb-sky {
        left: -260px;
        top: -320px;
        width: 1100px;
        height: 1100px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.07) 0%, rgba(56, 189, 248, 0.025) 38%, transparent 66%);
      }
      #orb-indigo {
        left: 1020px;
        top: 80px;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle, rgba(129, 140, 248, 0.13) 0%, rgba(129, 140, 248, 0.045) 40%, transparent 68%);
      }
      #orb-violet {
        left: 1340px;
        top: 520px;
        width: 860px;
        height: 860px;
        background: radial-gradient(circle, rgba(192, 132, 252, 0.11) 0%, rgba(192, 132, 252, 0.035) 40%, transparent 68%);
      }

      /* faint dot field, fading toward the left */
      #dot-field {
        position: absolute;
        left: -48px;
        top: 0;
        width: 2016px;
        height: 1080px;
        background-image: radial-gradient(rgba(148, 163, 184, 0.16) 1.2px, transparent 1.6px);
        background-size: 48px 48px;
        -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.45) 50%, rgba(0, 0, 0, 0.9) 100%);
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.45) 50%, rgba(0, 0, 0, 0.9) 100%);
      }

      #net {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }

      /* calm the text side + gentle vignette */
      #calm {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(5, 13, 26, 0.55) 0%, rgba(5, 13, 26, 0.35) 40%, rgba(5, 13, 26, 0) 62%),
          radial-gradient(ellipse at 60% 50%, transparent 55%, rgba(5, 13, 26, 0.6) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene">
        <div id="dot-field" data-layout-allow-overflow></div>
        <div id="orb-sky" class="orb" data-layout-allow-overflow></div>
        <div id="orb-indigo" class="orb" data-layout-allow-overflow></div>
        <div id="orb-violet" class="orb" data-layout-allow-overflow></div>
        <svg id="net" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="halo-sky">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="halo-indigo">
              <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="halo-violet">
              <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="pulse-glow">
              <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
              <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
            </radialGradient>
          </defs>
          <g id="net-lines"></g>
          <g id="net-halos"></g>
          <g id="net-nodes"></g>
          <g id="net-pulses"></g>
        </svg>
        <div id="calm"></div>
      </div>
    </div>
    <script>
      (function () {
        const W = 1920;
        const H = 1080;
        const LOOP = 10; // seconds — every cycle below is a whole number per LOOP
        const TAU = Math.PI * 2;
        const SVGNS = "http://www.w3.org/2000/svg";

        // Fixed-seed PRNG (mulberry32) — deterministic layout
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rand = mulberry32(20261016);
        const pick = (arr) => arr[Math.floor(rand() * arr.length)];
        const smooth = (e0, e1, x) => {
          const k = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
          return k * k * (3 - 2 * k);
        };
        // Side weighting: left ~55% of frame is calmer/dimmer
        const sideWeight = (x) => 0.38 + 0.62 * smooth(W * 0.35, W * 0.68, x);

        const COLORS = [
          { hex: "#38bdf8", halo: "halo-sky" },
          { hex: "#818cf8", halo: "halo-indigo" },
          { hex: "#c084fc", halo: "halo-violet" },
        ];

        // ---- Node layout: jittered grid, denser on the right ----
        const nodes = [];
        const cols = [
          { x0: 60, x1: 1040, count: 10 },
          { x0: 1040, x1: 1880, count: 18 },
        ];
        cols.forEach((band) => {
          const rows = band.count <= 10 ? 3 : 4;
          const per = Math.ceil(band.count / rows);
          let made = 0;
          for (let r = 0; r < rows && made < band.count; r++) {
            for (let c = 0; c < per && made < band.count; c++) {
              const cw = (band.x1 - band.x0) / per;
              const rh = (H - 120) / rows;
              const bx = band.x0 + cw * (c + 0.15 + rand() * 0.7);
              const by = 60 + rh * (r + 0.15 + rand() * 0.7);
              nodes.push({
                bx,
                by,
                ax: 10 + rand() * 22,
                ay: 8 + rand() * 18,
                kx: pick([1, 1, 2]),
                ky: pick([1, 1, 2]),
                px: rand() * TAU,
                py: rand() * TAU,
                kb: pick([1, 2]),
                pb: rand() * TAU,
                r: 2.2 + rand() * 2.2,
                col: COLORS[Math.floor(rand() * 3)],
                x: bx,
                y: by,
              });
              made++;
            }
          }
        });

        // ---- Edges: near neighbours by base distance, max 3 per node ----
        const edges = [];
        const deg = new Array(nodes.length).fill(0);
        const cand = [];
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const d = Math.hypot(nodes[i].bx - nodes[j].bx, nodes[i].by - nodes[j].by);
            if (d < 330) cand.push({ i, j, d });
          }
        }
        cand.sort((a, b) => a.d - b.d);
        cand.forEach((e) => {
          if (deg[e.i] < 3 && deg[e.j] < 3) {
            edges.push(e);
            deg[e.i]++;
            deg[e.j]++;
          }
        });

        // ---- Build SVG ----
        const gLines = document.getElementById("net-lines");
        const gHalos = document.getElementById("net-halos");
        const gNodes = document.getElementById("net-nodes");
        const gPulses = document.getElementById("net-pulses");

        edges.forEach((e, k) => {
          const ln = document.createElementNS(SVGNS, "line");
          ln.setAttribute("id", "edge-" + k);
          ln.setAttribute("stroke", k % 3 === 0 ? "#818cf8" : "#38bdf8");
          ln.setAttribute("stroke-width", "1");
          ln.setAttribute("stroke-linecap", "round");
          gLines.appendChild(ln);
          e.el = ln;
        });
        nodes.forEach((n, k) => {
          const h = document.createElementNS(SVGNS, "circle");
          h.setAttribute("id", "halo-" + k);
          h.setAttribute("r", String(n.r * 5));
          h.setAttribute("fill", "url(#" + n.col.halo + ")");
          gHalos.appendChild(h);
          n.halo = h;
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("id", "node-" + k);
          c.setAttribute("r", n.r.toFixed(2));
          c.setAttribute("fill", n.col.hex);
          gNodes.appendChild(c);
          n.el = c;
        });

        // Pulses: travel along a few right-side edges; integer laps per LOOP
        const rightEdges = edges
          .map((e, k) => ({ e, k }))
          .filter(({ e }) => (nodes[e.i].bx + nodes[e.j].bx) / 2 > 1000);
        const pulseSpecs = [
          { pick: 0.08, laps: 1, offset: 0.0, dir: 1 },
          { pick: 0.36, laps: 1, offset: 0.5, dir: -1 },
          { pick: 0.62, laps: 2, offset: 0.25, dir: 1 },
          { pick: 0.88, laps: 1, offset: 0.75, dir: -1 },
          { pick: 0.5, laps: 1, offset: 0.15, dir: 1 },
        ];
        const pulses = pulseSpecs.map((p, k) => {
          const edge = rightEdges[Math.floor(p.pick * rightEdges.length)].e;
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("id", "pulse-" + k);
          c.setAttribute("r", "9");
          c.setAttribute("fill", "url(#pulse-glow)");
          gPulses.appendChild(c);
          return Object.assign({ edge, el: c }, p);
        });

        // ---- Deterministic frame function: everything derives from t ----
        function renderAt(t) {
          const ph = (t / LOOP) * TAU; // one full turn per LOOP
          nodes.forEach((n) => {
            n.x = n.bx + n.ax * Math.sin(ph * n.kx + n.px);
            n.y = n.by + n.ay * Math.cos(ph * n.ky + n.py);
            const w = sideWeight(n.x);
            const breathe = 0.5 + 0.5 * Math.sin(ph * n.kb + n.pb);
            const op = (0.26 + 0.2 * breathe) * w;
            n.el.setAttribute("cx", n.x.toFixed(2));
            n.el.setAttribute("cy", n.y.toFixed(2));
            n.el.setAttribute("opacity", op.toFixed(3));
            n.halo.setAttribute("cx", n.x.toFixed(2));
            n.halo.setAttribute("cy", n.y.toFixed(2));
            n.halo.setAttribute("opacity", (op * 0.55).toFixed(3));
          });
          edges.forEach((e) => {
            const a = nodes[e.i];
            const b = nodes[e.j];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            const fall = 1 - smooth(200, 360, d);
            const w = sideWeight((a.x + b.x) / 2);
            const op = (0.07 + 0.11 * fall) * w;
            e.el.setAttribute("x1", a.x.toFixed(2));
            e.el.setAttribute("y1", a.y.toFixed(2));
            e.el.setAttribute("x2", b.x.toFixed(2));
            e.el.setAttribute("y2", b.y.toFixed(2));
            e.el.setAttribute("opacity", op.toFixed(3));
          });
          pulses.forEach((p) => {
            let u = ((t / LOOP) * p.laps + p.offset) % 1;
            if (u < 0) u += 1;
            // travel during first 60% of each lap, rest in darkness
            const travel = Math.min(1, u / 0.6);
            const s = p.dir > 0 ? travel : 1 - travel;
            const a = nodes[p.edge.i];
            const b = nodes[p.edge.j];
            const x = a.x + (b.x - a.x) * s;
            const y = a.y + (b.y - a.y) * s;
            const env = u < 0.6 ? Math.sin(Math.PI * travel) : 0;
            p.el.setAttribute("cx", x.toFixed(2));
            p.el.setAttribute("cy", y.toFixed(2));
            p.el.setAttribute("opacity", (0.55 * env * sideWeight(x)).toFixed(3));
          });
        }

        renderAt(0);

        const tl = gsap.timeline({ paused: true });

        // Network driver: linear 0 → LOOP; renderAt(LOOP) === renderAt(0)
        const clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          {
            t: LOOP,
            duration: LOOP,
            ease: "none",
            onUpdate: () => renderAt(clock.t),
          },
          0,
        );

        // Orbs: yoyo pairs whose periods divide 10s → back to rest at t=10
        tl.fromTo("#orb-sky", { x: 0 }, { x: 70, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#orb-sky", { y: 0 }, { y: 40, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo("#orb-indigo", { x: 0 }, { x: -110, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#orb-indigo", { y: 0 }, { y: 60, duration: 2.5, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo("#orb-violet", { x: 0, scale: 1 }, { x: -90, scale: 1.08, duration: 5, ease: "power1.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#orb-violet", { y: 0 }, { y: -70, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

        // Dot field: slides exactly one cell (48px) per loop — seamless
        tl.fromTo("#dot-field", { x: 0 }, { x: 48, duration: LOOP, ease: "none" }, 0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
